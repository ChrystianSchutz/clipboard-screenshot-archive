# Builds the landing page in site/ and publishes it to GitHub Pages.
# One-time setup: Settings -> Pages -> Build and deployment -> Source = "GitHub Actions".
name: Pages

on:
  push:
    branches: [master, main]
    paths:
      - 'site/**'
      - 'docs/media/**'
      - 'docs/screenshots/**'
      - 'build/icon.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a running deployment finish instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/configure-pages@v6
      # Copies the page plus only the screenshots and media it references, and fails on a broken link.
      - run: node site/build.mjs --out _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
