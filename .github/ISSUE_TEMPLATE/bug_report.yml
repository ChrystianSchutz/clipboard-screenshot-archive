name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste real clipboard content, tokens or screenshots with private data.
        Security problems go through private reporting instead, see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Copy a JSON payload from Chrome
        2. Press Ctrl+Alt+V
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown at the bottom of Settings.
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version and architecture
      placeholder: Windows 11 24H2 x64, macOS 26 arm64, Ubuntu 26.04 x64
  - type: textarea
    id: log
    attributes:
      label: Error log
      description: Relevant lines from `errors.jsonl` in the app's user-data folder. It contains no clipboard content, but check it before pasting.
      render: text
